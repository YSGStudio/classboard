<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리반 퀘스트 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#DCE3F5; --primary:#1E2A5A; --primary-soft:#C9D3F2; --accent:#FFD166;
  --shadow:#BCC8E8; --ink:#141B36; --muted:#4A5274; --card:#FFFFFF; --done:#FFF7DC;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif}
.jua{font-family:'Jua',sans-serif;font-weight:400}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:28px 32px;display:flex;flex-direction:column;gap:22px}

/* 헤더 */
header{background:var(--primary);color:#fff;border-radius:20px;padding:22px 26px;display:flex;flex-wrap:wrap;align-items:center;gap:24px}
.head-text{display:flex;flex-direction:column;gap:4px;flex:1 1 260px}
.head-text small{font-size:14px;color:var(--primary-soft)}
.head-text h1{margin:0;font-size:36px}
.goal{flex:1 1 360px;display:flex;flex-direction:column;gap:8px}
.goal-row{display:flex;justify-content:space-between;font-size:20px}
.bar{height:20px;background:rgba(255,255,255,.22);border-radius:10px;overflow:hidden}
.bar>div{height:100%;background:var(--accent);border-radius:10px;transition:width .4s}
.goal-done{font-size:15px;color:var(--accent);min-height:1em}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.ghost{min-height:44px;padding:0 16px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-weight:700;font-size:14px}
.ghost:hover{background:rgba(255,255,255,.12)}

/* 컬럼 */
.board{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.col{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:14px;border-radius:18px;padding:6px;min-height:200px;transition:background .15s}
.col.drag-over{background:rgba(30,42,90,.08);outline:3px dashed var(--shadow)}
.col-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.col-head h2{margin:0;font-size:26px}
.count{font-weight:700;font-size:14px;background:var(--primary);color:#fff;border-radius:12px;padding:2px 10px}
.add-btn{min-height:44px;border:2px dashed var(--muted);border-radius:14px;background:transparent;color:var(--muted);font-weight:700;font-size:15px}
.add-btn:hover{background:rgba(255,255,255,.5)}
.empty{font-size:14px;color:var(--muted);text-align:center;padding:18px 0}

/* 카드 */
.card{background:var(--card);border-radius:16px;padding:16px 18px;box-shadow:0 4px 0 var(--shadow);display:flex;flex-direction:column;gap:12px;cursor:grab}
.card.dragging{opacity:.5}
.card.doing{border:3px solid var(--accent);box-shadow:none}
.card.done{background:var(--done);box-shadow:none;flex-direction:row;align-items:center;gap:14px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.badge{font-size:12px;font-weight:700;border-radius:8px;padding:3px 8px}
.lv-easy{background:#E3F6EA;color:#17663A}
.lv-normal{background:#FFEFD9;color:#8A4A00}
.lv-hard{background:#FDE2E6;color:#A3172F}
.reward{font-size:18px;color:#8A5A00}
.title{font-size:22px;line-height:1.3;word-break:keep-all}
.meta{font-size:13px;color:var(--muted)}
.people{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.avatar{min-width:34px;height:34px;padding:0 6px;border-radius:17px;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{min-height:44px;flex:1;border:0;border-radius:12px;background:var(--primary);color:#fff;font-weight:700;font-size:15px}
.btn:hover{filter:brightness(1.25)}
.btn.gold{background:var(--accent);color:var(--ink)}
.icon-btn{min-width:44px;min-height:44px;border:0;border-radius:12px;background:#EEF1FA;color:var(--muted);display:flex;align-items:center;justify-content:center}
.icon-btn:hover{background:#DFE5F5;color:var(--ink)}
.done-body{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.done-body .title{font-size:21px}

/* 순위 */
.rank{background:#fff;border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.rank h3{margin:0;font-size:20px}
.rank-row{display:flex;justify-content:space-between;font-size:15px}

/* 대화상자 */
dialog{border:0;border-radius:20px;padding:0;width:min(460px,92vw);color:var(--ink);box-shadow:0 20px 60px rgba(20,27,54,.35)}
dialog::backdrop{background:rgba(20,27,54,.45)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:26px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:700}
.field input,.field select{min-height:44px;border:2px solid var(--shadow);border-radius:12px;padding:0 12px;background:#fff}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary)}
.hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.dlg-actions .btn{flex:0 0 auto;padding:0 20px}
.btn.light{background:#EEF1FA;color:var(--ink)}
.btn.danger{background:#A3172F}

/* 축하 */
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:var(--primary);color:#fff;padding:14px 22px;border-radius:14px;font-size:20px;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media (max-width:640px){.wrap{padding:16px}.head-text h1{font-size:28px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-text">
      <small id="className"></small>
      <h1 class="jua" id="goalText"></h1>
    </div>
    <div class="goal">
      <div class="goal-row jua"><span>우리반 별</span><span id="starText"></span></div>
      <div class="bar" role="progressbar" aria-label="학급 목표 진행" id="starBar"><div id="starFill"></div></div>
      <div class="goal-done jua" id="goalDone"></div>
    </div>
    <div class="head-actions">
      <button class="ghost" id="settingsBtn" type="button">설정</button>
      <button class="ghost" id="fullBtn" type="button">전체 화면</button>
    </div>
  </header>

  <main class="board">
    <section class="col" data-col="todo">
      <div class="col-head"><h2 class="jua">퀘스트 게시판</h2><span class="count" id="cnt-todo">0</span></div>
      <button class="add-btn" id="addBtn" type="button">+ 새 퀘스트 만들기</button>
      <div class="list" id="list-todo" style="display:flex;flex-direction:column;gap:14px"></div>
    </section>
    <section class="col" data-col="doing">
      <div class="col-head"><h2 class="jua">도전 중</h2><span class="count" id="cnt-doing">0</span></div>
      <div class="list" id="list-doing" style="display:flex;flex-direction:column;gap:14px"></div>
    </section>
    <section class="col" data-col="done">
      <div class="col-head"><h2 class="jua">클리어!</h2><span class="count" id="cnt-done">0</span></div>
      <div class="list" id="list-done" style="display:flex;flex-direction:column;gap:14px"></div>
      <div class="rank">
        <h3 class="jua">모둠 별 순위</h3>
        <div id="rankList"></div>
      </div>
    </section>
  </main>
</div>

<!-- 퀘스트 만들기 / 고치기 -->
<dialog id="questDlg">
  <form class="dlg" method="dialog" id="questForm">
    <h2 class="jua" id="questDlgTitle">새 퀘스트</h2>
    <div class="field">
      <label for="qTitle">퀘스트 이름</label>
      <input id="qTitle" required maxlength="40" placeholder="예: 영어 단어 10개 외우기">
    </div>
    <div class="grid2">
      <div class="field">
        <label for="qLevel">난이도</label>
        <select id="qLevel">
          <option value="easy">쉬움 (별 +2)</option>
          <option value="normal">보통 (별 +5)</option>
          <option value="hard">어려움 · 보스 (별 +10)</option>
        </select>
      </div>
      <div class="field">
        <label for="qGroup">누가 하나요?</label>
        <select id="qGroup"></select>
      </div>
    </div>
    <div class="field">
      <label for="qPeople">참여하는 친구 (선택)</label>
      <input id="qPeople" maxlength="60" placeholder="예: 서연, 민준, 지호">
      <span class="hint">쉼표(,)로 이름을 나눠 적어요.</span>
    </div>
    <div class="field">
      <label for="qNote">메모 (선택)</label>
      <input id="qNote" maxlength="40" placeholder="예: 금요일까지 · 2단계 중 1단계">
    </div>
    <div class="dlg-actions">
      <button class="btn danger" type="button" id="qDelete" hidden>삭제</button>
      <span style="flex:1"></span>
      <button class="btn light" type="button" id="qCancel">취소</button>
      <button class="btn" type="submit">저장</button>
    </div>
  </form>
</dialog>

<!-- 설정 -->
<dialog id="setDlg">
  <form class="dlg" method="dialog" id="setForm">
    <h2 class="jua">보드 설정</h2>
    <div class="field"><label for="sClass">반 이름</label><input id="sClass" maxlength="30"></div>
    <div class="field"><label for="sGoal">학급 목표 문구</label><input id="sGoal" maxlength="40"></div>
    <div class="grid2">
      <div class="field"><label for="sTarget">목표 별 수</label><input id="sTarget" type="number" min="1" max="9999"></div>
      <div class="field"><label for="sBonus">지금 별 수</label><input id="sBonus" type="number" min="0" max="99999"></div>
    </div>
    <span class="hint">"지금 별 수"를 바꾸면 우리반 별이 그 숫자로 맞춰져요.</span>
    <div class="grid2">
      <div class="field"><label for="g0">1모둠 이름</label><input id="g0" maxlength="12"></div>
      <div class="field"><label for="g1">2모둠 이름</label><input id="g1" maxlength="12"></div>
      <div class="field"><label for="g2">3모둠 이름</label><input id="g2" maxlength="12"></div>
      <div class="field"><label for="g3">4모둠 이름</label><input id="g3" maxlength="12"></div>
    </div>
    <div class="dlg-actions">
      <button class="btn danger" type="button" id="sReset">처음부터 다시</button>
      <span style="flex:1"></span>
      <button class="btn light" type="button" id="sCancel">취소</button>
      <button class="btn" type="submit">저장</button>
    </div>
  </form>
</dialog>

<!-- 초기화 확인 -->
<dialog id="resetDlg">
  <div class="dlg">
    <h2 class="jua">정말 처음부터 할까요?</h2>
    <p style="margin:0">모든 퀘스트와 별이 지워지고 예시 보드로 돌아가요. 되돌릴 수 없어요.</p>
    <div class="dlg-actions">
      <button class="btn light" type="button" id="rNo">취소</button>
      <button class="btn danger" type="button" id="rYes">지우기</button>
    </div>
  </div>
</dialog>

<div class="toast jua" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var KEY = 'class-quest-board-v1';
  var LEVELS = {
    easy:{label:'쉬움', star:2, cls:'lv-easy'},
    normal:{label:'보통', star:5, cls:'lv-normal'},
    hard:{label:'어려움 · 보스', star:10, cls:'lv-hard'}
  };
  var AVATAR_COLORS = ['#FF8FA3','#7FD6A4','#8EC5FF','#FFD66B','#C4A8FF','#FFB38A'];

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function sample(){
    return {
      className:'4학년 2반 퀘스트 보드',
      goal:'별 200개 모으면 영화 보는 날!',
      target:200,
      stars:146,
      groups:[{name:'1모둠 해바라기',stars:38},{name:'2모둠 무지개',stars:31},{name:'3모둠 별빛',stars:42},{name:'4모둠 초록숲',stars:35}],
      quests:[
        {id:uid(),title:'영어 단어 10개 외우기',level:'easy',group:'all',people:[],note:'',col:'todo'},
        {id:uid(),title:'과학실 실험 결과 정리',level:'normal',group:'1',people:[],note:'',col:'todo'},
        {id:uid(),title:'학급 신문 1호 완성',level:'hard',group:'all',people:[],note:'',col:'todo'},
        {id:uid(),title:'운동회 응원가 만들기',level:'normal',group:'2',people:['서연','민준','지호'],note:'2단계 / 3단계',col:'doing'},
        {id:uid(),title:'줄넘기 100번 연속',level:'easy',group:'solo',people:['하은'],note:'최고 기록 82번',col:'doing'},
        {id:uid(),title:'독서록 3권 채우기',level:'normal',group:'solo',people:['서연'],note:'',col:'done'},
        {id:uid(),title:'교실 대청소',level:'hard',group:'all',people:[],note:'',col:'done'}
      ]
    };
  }

  var state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e) { state = null; }
  if (!state || !state.quests) state = sample();

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} }

  var $ = function(id){ return document.getElementById(id); };

  function groupLabel(g){
    if (g === 'all') return '우리반 모두';
    if (g === 'solo') return '개인';
    var i = parseInt(g,10)-1;
    return state.groups[i] ? state.groups[i].name : '모둠';
  }

  function svgIcon(path){
    return '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+path+'</svg>';
  }
  var ICON_EDIT = svgIcon('<path d="M4 20h4L19 9l-4-4L4 16z"></path>');
  var ICON_BACK = svgIcon('<path d="M9 14L4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 0 12h-3"></path>');
  var STAR = '<svg width="40" height="40" viewBox="0 0 24 24" fill="#FFD166" stroke="#8A5A00" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l2.8 5.7 6.3.9-4.6 4.4 1.1 6.2L12 17l-5.6 3 1.1-6.2L2.9 9.4l6.3-.9z"></path></svg>';

  function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function el(html){ var t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }

  function cardFor(q){
    var lv = LEVELS[q.level] || LEVELS.easy;
    var card;
    if (q.col === 'done') {
      card = el(
        '<article class="card done" draggable="true">'+STAR+
        '<div class="done-body"><span class="title jua">'+esc(q.title)+'</span>'+
        '<span class="meta">'+esc(q.people.length? q.people.join(', ') : groupLabel(q.group))+' · 별 +'+lv.star+' 받음</span></div>'+
        '<button class="icon-btn" type="button" data-act="back" aria-label="도전 중으로 되돌리기" title="되돌리기">'+ICON_BACK+'</button>'+
        '</article>');
    } else {
      var people = q.people.map(function(p,i){
        return '<span class="avatar" style="background:'+AVATAR_COLORS[i%AVATAR_COLORS.length]+'">'+esc(p)+'</span>';
      }).join('');
      var metaLine = groupLabel(q.group) + (q.note ? ' · '+q.note : '');
      var actions = q.col === 'todo'
        ? '<button class="btn" type="button" data-act="start">도전하기</button>'
        : '<button class="icon-btn" type="button" data-act="back" aria-label="퀘스트 게시판으로 되돌리기" title="되돌리기">'+ICON_BACK+'</button><button class="btn gold" type="button" data-act="clear">클리어!</button>';
      card = el(
        '<article class="card '+(q.col==='doing'?'doing':'')+'" draggable="true">'+
        '<div class="card-top"><span class="badge '+lv.cls+'">'+lv.label+'</span><span class="reward jua">별 +'+lv.star+'</span></div>'+
        '<span class="title jua">'+esc(q.title)+'</span>'+
        (people ? '<div class="people">'+people+'</div>' : '')+
        '<span class="meta">'+esc(metaLine)+'</span>'+
        '<div class="actions"><button class="icon-btn" type="button" data-act="edit" aria-label="고치기" title="고치기">'+ICON_EDIT+'</button>'+actions+'</div>'+
        '</article>');
    }
    card.dataset.id = q.id;
    card.addEventListener('dragstart', function(e){ card.classList.add('dragging'); e.dataTransfer.setData('text/plain', q.id); e.dataTransfer.effectAllowed='move'; });
    card.addEventListener('dragend', function(){ card.classList.remove('dragging'); });
    card.addEventListener('click', function(e){
      var b = e.target.closest('button'); if (!b) return;
      var act = b.dataset.act;
      if (act === 'start') move(q.id,'doing');
      else if (act === 'clear') move(q.id,'done');
      else if (act === 'back') move(q.id, q.col==='done' ? 'doing' : 'todo');
      else if (act === 'edit') openQuest(q);
    });
    return card;
  }

  function starDelta(q, sign){
    var s = (LEVELS[q.level]||LEVELS.easy).star * sign;
    state.stars = Math.max(0, state.stars + s);
    var i = parseInt(q.group,10)-1;
    if (state.groups[i]) state.groups[i].stars = Math.max(0, state.groups[i].stars + s);
  }

  function move(id, col){
    var q = state.quests.find(function(x){return x.id===id;});
    if (!q || q.col === col) return;
    var wasDone = q.col === 'done';
    if (wasDone && col !== 'done') starDelta(q,-1);
    if (!wasDone && col === 'done') {
      var before = state.stars;
      starDelta(q,1);
      var lv = LEVELS[q.level]||LEVELS.easy;
      if (before < state.target && state.stars >= state.target) toast('목표 달성! '+state.goal);
      else toast('클리어! 별 +'+lv.star);
    }
    q.col = col;
    // 옮긴 카드를 맨 위로
    state.quests = state.quests.filter(function(x){return x.id!==id;});
    state.quests.unshift(q);
    save(); render();
  }

  function render(){
    $('className').textContent = state.className;
    $('goalText').textContent = state.goal;
    $('starText').textContent = state.stars + ' / ' + state.target;
    var pct = Math.min(100, Math.round(state.stars / Math.max(1,state.target) * 100));
    $('starFill').style.width = pct + '%';
    $('starBar').setAttribute('aria-valuenow', pct);
    $('goalDone').textContent = state.stars >= state.target ? '목표 달성! 축하해요' : '앞으로 별 ' + (state.target - state.stars) + '개';
    ['todo','doing','done'].forEach(function(c){
      var list = $('list-'+c); list.innerHTML = '';
      var qs = state.quests.filter(function(q){return q.col===c;});
      $('cnt-'+c).textContent = qs.length;
      if (!qs.length) list.appendChild(el('<div class="empty">'+(c==='todo'?'새 퀘스트를 만들어 보세요':c==='doing'?'카드를 여기로 끌어오거나 "도전하기"를 눌러요':'아직 클리어한 퀘스트가 없어요')+'</div>'));
      qs.forEach(function(q){ list.appendChild(cardFor(q)); });
    });
    var ranked = state.groups.map(function(g,i){return {name:g.name,stars:g.stars};}).sort(function(a,b){return b.stars-a.stars;});
    $('rankList').innerHTML = ranked.map(function(g,i){
      return '<div class="rank-row"><span>'+(i+1)+'위 · '+esc(g.name)+'</span><strong>'+g.stars+'</strong></div>';
    }).join('');
  }

  // 끌어서 옮기기
  document.querySelectorAll('.col').forEach(function(col){
    col.addEventListener('dragover', function(e){ e.preventDefault(); col.classList.add('drag-over'); });
    col.addEventListener('dragleave', function(e){ if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over'); });
    col.addEventListener('drop', function(e){ e.preventDefault(); col.classList.remove('drag-over'); move(e.dataTransfer.getData('text/plain'), col.dataset.col); });
  });

  // 퀘스트 대화상자
  var editing = null;
  function fillGroupOptions(){
    var opts = '<option value="all">우리반 모두</option><option value="solo">개인</option>';
    state.groups.forEach(function(g,i){ opts += '<option value="'+(i+1)+'">'+esc(g.name)+'</option>'; });
    $('qGroup').innerHTML = opts;
  }
  function openQuest(q){
    editing = q || null;
    fillGroupOptions();
    $('questDlgTitle').textContent = q ? '퀘스트 고치기' : '새 퀘스트';
    $('qTitle').value = q ? q.title : '';
    $('qLevel').value = q ? q.level : 'easy';
    $('qGroup').value = q ? q.group : 'all';
    $('qPeople').value = q ? q.people.join(', ') : '';
    $('qNote').value = q ? q.note : '';
    $('qDelete').hidden = !q;
    $('questDlg').showModal();
    $('qTitle').focus();
  }
  $('addBtn').addEventListener('click', function(){ openQuest(null); });
  $('qCancel').addEventListener('click', function(){ $('questDlg').close(); });
  $('qDelete').addEventListener('click', function(){
    if (!editing) return;
    if (editing.col === 'done') starDelta(editing,-1);
    var id = editing.id;
    state.quests = state.quests.filter(function(x){return x.id!==id;});
    save(); render(); $('questDlg').close();
  });
  $('questForm').addEventListener('submit', function(e){
    e.preventDefault();
    var title = $('qTitle').value.trim(); if (!title) return;
    var data = {
      title:title, level:$('qLevel').value, group:$('qGroup').value,
      people:$('qPeople').value.split(',').map(function(s){return s.trim();}).filter(Boolean).slice(0,6),
      note:$('qNote').value.trim()
    };
    if (editing) {
      if (editing.col === 'done') starDelta(editing,-1);
      Object.assign(editing, data);
      if (editing.col === 'done') starDelta(editing,1);
    } else {
      data.id = uid(); data.col = 'todo';
      state.quests.unshift(data);
    }
    save(); render(); $('questDlg').close();
  });

  // 설정 대화상자
  $('settingsBtn').addEventListener('click', function(){
    $('sClass').value = state.className; $('sGoal').value = state.goal;
    $('sTarget').value = state.target; $('sBonus').value = state.stars;
    state.groups.forEach(function(g,i){ $('g'+i).value = g.name; });
    $('setDlg').showModal();
  });
  $('sCancel').addEventListener('click', function(){ $('setDlg').close(); });
  $('setForm').addEventListener('submit', function(e){
    e.preventDefault();
    state.className = $('sClass').value.trim() || state.className;
    state.goal = $('sGoal').value.trim() || state.goal;
    state.target = Math.max(1, parseInt($('sTarget').value,10) || state.target);
    var s = parseInt($('sBonus').value,10); if (!isNaN(s) && s >= 0) state.stars = s;
    state.groups.forEach(function(g,i){ var v = $('g'+i).value.trim(); if (v) g.name = v; });
    save(); render(); $('setDlg').close();
  });
  $('sReset').addEventListener('click', function(){ $('resetDlg').showModal(); });
  $('rNo').addEventListener('click', function(){ $('resetDlg').close(); });
  $('rYes').addEventListener('click', function(){
    state = sample(); save(); render(); $('resetDlg').close(); $('setDlg').close();
  });

  // 전체 화면 (교실 TV용)
  $('fullBtn').addEventListener('click', function(){
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    } catch(e) {}
  });
  document.addEventListener('fullscreenchange', function(){
    $('fullBtn').textContent = document.fullscreenElement ? '전체 화면 끄기' : '전체 화면';
  });

  var toastTimer;
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  render();
})();
</script>
</body>
</html>
